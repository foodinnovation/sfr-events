name: Health check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"     # daily

jobs:
  deck:
    runs-on: ubuntu-latest
    steps:
      - name: Deck function and Microsoft connection
        run: |
          base="https://iudsjtrdtncqqhswcnfu.supabase.co/functions/v1/deck"
          echo "health: $(curl -s -m 30 "$base?health=1")"
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 "$base?id=00000000-0000-0000-0000-000000000000")
          echo "signed-out deck request returns HTTP $code (expect 401)"
          curl -s -m 30 "$base?health=1" | grep -q '"graph":"ok"'
